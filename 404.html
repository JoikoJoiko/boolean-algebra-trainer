<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Страница не найдена — Ошибка 404</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/adaptive.css">
    <script>
        (function () {
            var THEME_KEY = 'bat_theme';

            try {
                var saved = localStorage.getItem(THEME_KEY);
                var prefersLight =
                    window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: light)').matches;

                var isLight = saved === 'light' || (saved === null && prefersLight);

                if (isLight) {
                    document.documentElement.classList.add('page--light');
                } else {
                    document.documentElement.classList.remove('page--light');
                }
            } catch (e) {
            }
        })();
    </script>
    <link rel="icon" type="image/svg+xml" href="img/content/icon.png">
</head>

<body class="page page--404">

    <header class="header">
        <div class="container header__inner">
            <div class="logo">BoolTrainer</div>

            <nav class="nav">
                <a href="index.html" class="nav__link">Главная</a>
                <a href="theory.html" class="nav__link">Теория</a>
                <a href="simulator.html" class="nav__link">Тренажёр</a>
            </nav>

            <button class="theme-toggle" id="themeToggle" aria-label="Сменить тему">
                <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <g>
                        <line x1="12" y1="2" x2="12" y2="5"></line>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                        <line x1="4.2" y1="4.2" x2="6.3" y2="6.3"></line>
                        <line x1="17.7" y1="17.7" x2="19.8" y2="19.8"></line>
                        <line x1="2" y1="12" x2="5" y2="12"></line>
                        <line x1="19" y1="12" x2="22" y2="12"></line>
                        <line x1="4.2" y1="19.8" x2="6.3" y2="17.7"></line>
                        <line x1="17.7" y1="6.3" x2="19.8" y2="4.2"></line>
                    </g>
                </svg>

                <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 0 1 11.2 3
               7 7 0 1 0 21 12.8z">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <main class="main main--center">

        <section class="notfound">
            <div class="container notfound__inner">

                <div class="notfound__code">404</div>

                <h1 class="notfound__title">Страница не найдена</h1>

                <p class="notfound__text">
                    Возможно, вы попали сюда по неверной ссылке.
                    Или страница была перемещена.
                    Но не волнуйтесь — вы всё ещё на правильном пути.
                </p>

                <div class="notfound__actions">
                    <a href="index.html" class="btn btn--primary">Вернуться на главную</a>
                    <a href="theory.html" class="btn btn--ghost">Перейти к теории</a>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <span class="footer__text">© 2025, Тренажёр по булевой алгебре</span>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
